# Render.yaml – Blueprint for deploying LinguaBridge backend
services:
  - type: web
    name: linguabridge-api
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: chmod +x build.sh && ./build.sh
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: DEBUG
        value: "false"
      - key: LOG_LEVEL
        value: "INFO"
      - key: USE_GPU
        value: "cpu"
      - key: WHISPER_MODEL
        value: "base"
      - key: PRELOAD_MODELS
        value: "false"
      - key: DATABASE_URL
        value: "sqlite+aiosqlite:///./linguabridge.db"
      - key: UPLOAD_DIR
        value: "./uploads"
      - key: EXPORT_DIR
        value: "./exports"
    healthCheckPath: /health
